[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-eval"
version = "0.1.0"
description = "Phase 0 Evaluation Foundation for Secure Agentic Banking Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
